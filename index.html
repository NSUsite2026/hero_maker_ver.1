<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヒーローメーカー</title>
    <meta name="description" content="sample text">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/sanitize.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" href="./assets/images/favicon.png" type="image/png">
</head>



<body>
    <div class="wrapper">

        <img src="./assets/images/logo.png" class="logo-image">


        <div class="box how_to_use">
            <h2>使い方</h2>
            <p>
                説明内容～～～
                <br>ボタンを押して
                <br>オリジナルのヒーローを作ろう！
            </p>
        </div>



        <div class="box monitor">
            <div class="img01">
                <img id="img001" src="./assets/images/blank0.png" height="600px">
            </div>
            <div class="img02">
                <img id="img002" src="./assets/images/blank0.png" height="600px">
            </div>
            <div class="img03">
                <img id="img003" src="./assets/images/u1.png" height="600px">
            </div>
            <div class="img04">
                <img id="img004" src="./assets/images/l1.png" height="600px">
            </div>
            <div class="img05">
                <img id="img005" src="./assets/images/blank0.png" height="600px">
            </div>
            <div class="imgback">
                <img src="./assets/images/monitor_test.png" height="600px">
            </div>
        </div>

    

        <div class="box button">
            <h2>パーツ選択</h2>
        
            <div class="tabs">
                <button class="tab active" data-target="heads">ヘッド</button>
                <button class="tab" data-target="armor">アーマー</button>
                <button class="tab" data-target="under">アンダー</button>
                <button class="tab" data-target="line">ライン</button>
            </div>

            <div id="heads" class="parts active">
            <button onclick="changeH('./assets/images/h1-1.png')"><img src="./assets/images/sh1-1.png">ロード赤</button>
            <button onclick="changeH('./assets/images/h1-2.png')"><img src="./assets/images/sh1-2.png">ロード青</button>
            <button onclick="changeH('./assets/images/h1-3.png')"><img src="./assets/images/sh1-3.png">ロード緑</button>
            <button onclick="changeH('./assets/images/h1-4.png')"><img src="./assets/images/sh1-4.png">ロード黄</button>
            <button onclick="changeH('./assets/images/h1-5.png')"><img src="./assets/images/sh1-5.png">ロード黒</button>
            <button onclick="changeH('./assets/images/h2-1.png')"><img src="./assets/images/sh2-1.png">バーサーカー赤</button>
            <button onclick="changeH('./assets/images/h2-2.png')"><img src="./assets/images/sh2-2.png">バーサーカー青</button>
            <button onclick="changeH('./assets/images/h2-3.png')"><img src="./assets/images/sh2-3.png">バーサーカー緑</button>
            <button onclick="changeH('./assets/images/h2-4.png')"><img src="./assets/images/sh2-4.png">バーサーカー黄</button>
            <button onclick="changeH('./assets/images/h2-5.png')"><img src="./assets/images/sh2-5.png">バーサーカー黒</button>
            </div>

            <div id="armor" class="parts">
            <button onclick="changeA('./assets/images/a1-1.png','./assets/images/ab1-1.png')"><img src="./assets/images/a1-1.png">ロード赤</button>
            <button onclick="changeA('./assets/images/a1-2.png','./assets/images/ab1-2.png')"><img src="./assets/images/a1-2.png">ロード青</button>
            <button onclick="changeA('./assets/images/a1-3.png','./assets/images/ab1-3.png')"><img src="./assets/images/a1-3.png">ロード緑</button>
            <button onclick="changeA('./assets/images/a1-4.png','./assets/images/ab1-4.png')"><img src="./assets/images/a1-4.png">ロード黄</button>
            <button onclick="changeA('./assets/images/a1-5.png','./assets/images/ab1-5.png')"><img src="./assets/images/a1-5.png">ロード黒</button>
            <button onclick="changeA('./assets/images/a2-1.png','./assets/images/blank0.png')"><img src="./assets/images/a2-1.png">バーサーカー赤</button>
            <button onclick="changeA('./assets/images/a2-2.png','./assets/images/blank0.png')"><img src="./assets/images/a2-2.png">バーサーカー青</button>
            <button onclick="changeA('./assets/images/a2-3.png','./assets/images/blank0.png')"><img src="./assets/images/a2-3.png">バーサーカー緑</button>
            <button onclick="changeA('./assets/images/a2-4.png','./assets/images/blank0.png')"><img src="./assets/images/a2-4.png">バーサーカー黄</button>
            <button onclick="changeA('./assets/images/a2-5.png','./assets/images/blank0.png')"><img src="./assets/images/a2-5.png">バーサーカー黒</button>
            </div>

            <div id="under" class="parts">
            <button onclick="changeU('./assets/images/u1.png')"><img src="./assets/images/u1.png">黒</button>
            <button onclick="changeU('./assets/images/u2.png')"><img src="./assets/images/u2.png">灰</button>
            <button onclick="changeU('./assets/images/u3.png')"><img src="./assets/images/u3.png">白</button>
            <button onclick="changeU('./assets/images/u4.png')"><img src="./assets/images/u4.png">紅</button>
            <button onclick="changeU('./assets/images/u5.png')"><img src="./assets/images/u5.png">赤</button>
            <button onclick="changeU('./assets/images/u6.png')"><img src="./assets/images/u6.png">橙</button>
            <button onclick="changeU('./assets/images/u7.png')"><img src="./assets/images/u7.png">黄</button>
            <button onclick="changeU('./assets/images/u8.png')"><img src="./assets/images/u8.png">緑</button>
            <button onclick="changeU('./assets/images/u9.png')"><img src="./assets/images/u9.png">青緑</button>
            <button onclick="changeU('./assets/images/u10.png')"><img src="./assets/images/u10.png">水</button>
            <button onclick="changeU('./assets/images/u11.png')"><img src="./assets/images/u11.png">青</button>
            <button onclick="changeU('./assets/images/u12.png')"><img src="./assets/images/u12.png">紺</button>
            <button onclick="changeU('./assets/images/u13.png')"><img src="./assets/images/u13.png">紫</button>
            <button onclick="changeU('./assets/images/u14.png')"><img src="./assets/images/u14.png">赤紫</button>
            <button onclick="changeU('./assets/images/u15.png')"><img src="./assets/images/u15.png">桃</button>
            <button onclick="changeU('./assets/images/u16.png')"><img src="./assets/images/u16.png">茶</button>
            </div>

            <div id="line" class="parts">
            <button onclick="changeL('./assets/images/l1.png')"><img src="./assets/images/l1.png">黒</button>
            <button onclick="changeL('./assets/images/l2.png')"><img src="./assets/images/l2.png">灰</button>
            <button onclick="changeL('./assets/images/l3.png')"><img src="./assets/images/l3.png">白</button>
            <button onclick="changeL('./assets/images/l4.png')"><img src="./assets/images/l4.png">紅</button>
            <button onclick="changeL('./assets/images/l5.png')"><img src="./assets/images/l5.png">赤</button>
            <button onclick="changeL('./assets/images/l6.png')"><img src="./assets/images/l6.png">橙</button>
            <button onclick="changeL('./assets/images/l7.png')"><img src="./assets/images/l7.png">黄</button>
            <button onclick="changeL('./assets/images/l8.png')"><img src="./assets/images/l8.png">緑</button>
            <button onclick="changeL('./assets/images/l9.png')"><img src="./assets/images/l9.png">青緑</button>
            <button onclick="changeL('./assets/images/l10.png')"><img src="./assets/images/l10.png">水</button>
            <button onclick="changeL('./assets/images/l11.png')"><img src="./assets/images/l11.png">青</button>
            <button onclick="changeL('./assets/images/l12.png')"><img src="./assets/images/l12.png">紺</button>
            <button onclick="changeL('./assets/images/l13.png')"><img src="./assets/images/l13.png">紫</button>
            <button onclick="changeL('./assets/images/l14.png')"><img src="./assets/images/l14.png">赤紫</button>
            <button onclick="changeL('./assets/images/l15.png')"><img src="./assets/images/l15.png">桃</button>
            <button onclick="changeL('./assets/images/l16.png')"><img src="./assets/images/l16.png">虹</button>
            </div>
        
        </div>



        <script src="./assets/js/app.js"></script>
    </div>    
</body>



</html>
